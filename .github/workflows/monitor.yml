name: Monitor Prices

on:
  schedule:
    # Run twice daily at 9:00 AM and 9:00 PM UTC
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Restore tracker state from cache
      uses: actions/cache/restore@v4
      with:
        path: tracker_state.json
        key: tracker-state-${{ github.run_id }}
        restore-keys: |
          tracker-state-

    - name: Run tracker
      env:
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
      run: |
        python tracker.py items.json | tee tracker_output.json

    - name: Save tracker state to cache
      uses: actions/cache/save@v4
      if: always()
      with:
        path: tracker_state.json
        key: tracker-state-${{ github.run_id }}

    - name: Create GitHub Issues on alerts
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('tracker_output.json')) return;

          const output = JSON.parse(fs.readFileSync('tracker_output.json', 'utf8'));
          const results = output.results || {};

          for (const [id, result] of Object.entries(results)) {
            const alerts = result.alerts || [];
            if (alerts.length === 0) continue;

            const title = `Alert: ${id} — ${alerts[0]}`;
            const body = [
              `## Price Tracker Alert`,
              `**Item ID:** ${id}`,
              `**Alerts:** ${alerts.join(', ')}`,
              result.url ? `**URL:** ${result.url}` : '',
              result.search_url ? `**Search:** ${result.search_url}` : '',
              result.price ? `**Price:** $${result.price}` : '',
              result.min_price ? `**Min Price:** $${result.min_price}` : '',
              `**Detected:** ${new Date().toISOString()}`,
            ].filter(Boolean).join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [`tracker-${id}`],
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [`tracker-${id}`, 'automated'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `### Update ${new Date().toISOString()}\n${alerts.join('\n')}`,
              });
            }
          }
